<div id="reports-list-view" class="view-content">

    <div class="card">

        <div class="card-header">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24" style="vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75a2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 18H5.625c-1.026 0-1.875-.84-1.875-1.875v-11.25c0-1.026.84-1.875 1.875-1.875H9.75V4.875c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125v1.512h1.5a2.25 2.25 0 012.25 2.25v11.25a2.25 2.25 0 01-2.25 2.25h-2.25" />
                </svg>
                <span>Gestión de Partes de Servicio</span>
            </h2>
            <div class="view-toggle">
                <button id="show-reports-list-btn" class="toggle-button active">Listado</button>
                <button id="show-reports-calendar-btn" class="toggle-button">Calendario</button>
            </div>
        </div>

        <div class="card-body">
            
            <div class="filter-group">
                <div class="form-group">
                    <label for="report-filter-year">Año</label>
                    <select id="report-filter-year" class="selector"></select>
                </div>
                <div class="form-group">
                    <label for="report-filter-month">Mes</label>
                    <select id="report-filter-month" class="selector"></select>
                </div>
                <div class="form-group">
                    <label for="report-filter-agent">Agente</label>
                    <select id="report-filter-agent" class="selector"></select>
                </div>
                <div class="form-group">
                    <label for="report-filter-status">Estado</label>
                    <select id="report-filter-status" class="selector">
                        <option value="all">Todos</option>
                        <option value="pending_review" selected>Pendiente de Revisión</option>
                        <option value="open">Abierto</option>
                        <option value="validated">Validado</option>
                        <option value="returned">Devuelto</option>
                        <option value="closed">Cerrado</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button id="apply-report-filters-btn" class="button button-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                        </svg>
                        <span>Filtrar</span>
                    </button>
                    <button id="clear-report-filters-btn" class="button button-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Limpiar</span>
                    </button>
                </div>
            </div>

            <hr class="subtle-divider">

            <div id="reports-list-content" class="reports-sub-view">
                <div id="reports-list-container" class="table-container">
                    </div>
            </div>
            <div id="reports-calendar-content" class="reports-sub-view hidden">
                <div id="service-reports-calendar">
                    </div>
            </div>
        </div>
    </div>
</div>

<style>
    .view-toggle {
        display: inline-flex;
        background-color: var(--color-bg-table-header);
        border-radius: var(--border-radius-md);
        padding: 4px;
    }
    .toggle-button {
        padding: 6px 16px;
        border: none;
        background-color: transparent;
        color: var(--color-text-secondary);
        font-weight: 600;
        font-family: var(--font-primary);
        font-size: 0.9rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all var(--transition-fast);
    }
    .toggle-button:hover {
        color: var(--color-text);
    }
    .toggle-button.active {
        background-color: var(--color-bg-card);
        color: var(--color-primary);
        box-shadow: var(--shadow-card);
    }
    .subtle-divider {
        border: none;
        height: 1px;
        background-color: var(--color-border);
        margin: var(--space-3) 0;
    }
</style>
