<div id="identificaciones-view-content">
  <div class="card">
    <div class="card-header">
      <h2><i data-feather="users"></i><span>Módulo de Identificaciones</span></h2>
    </div>
    <div class="card-body no-padding">
      <div class="sub-nav-tabs">
        <button class="sub-nav-tab active" data-subview="personas">Personas</button>
        <button class="sub-nav-tab" data-subview="vehiculos">Vehículos</button>
        <button class="sub-nav-tab" data-subview="establecimientos">Establecimientos</button>
      </div>

      <div id="personas-subview" class="sub-view active">
        <div class="view-header">
          <h3>Listado de Personas</h3>
          <div class="actions-group">
            <div class="form-group">
              <label for="personas-search-input" class="sr-only">Buscar persona</label>
              <input type="search" id="personas-search-input" placeholder="Buscar por DNI, nombre, mote...">
            </div>
            <button id="personas-search-btn" class="button button-secondary" type="button" title="Buscar Persona">
              <i data-feather="search"></i>
            </button>
            <button id="create-persona-btn" class="button button-primary">
              <i data-feather="plus"></i><span>Nueva Persona</span>
            </button>
          </div>
        </div>
        <div id="personas-list-container" class="table-container"></div>
      </div>

      <div id="vehiculos-subview" class="sub-view hidden">
        <div class="view-header">
          <h3>Listado de Vehículos</h3>
          <div class="actions-group">
            <div class="form-group">
              <label for="vehiculos-search-input" class="sr-only">Buscar vehículo</label>
              <input type="search" id="vehiculos-search-input" placeholder="Buscar por matrícula, marca...">
            </div>
            <button id="vehiculos-search-btn" class="button button-secondary" type="button" title="Buscar Vehículo">
              <i data-feather="search"></i>
            </button>
            <button id="create-vehiculo-btn" class="button button-primary">
              <i data-feather="plus"></i><span>Nuevo Vehículo</span>
            </button>
          </div>
        </div>
        <div id="vehiculos-list-container" class="table-container"></div>
      </div>

      <div id="establecimientos-subview" class="sub-view hidden">
        <div class="view-header">
          <h3>Listado de Establecimientos</h3>
          <div class="actions-group">
            <div class="form-group">
              <label for="establecimientos-search-input" class="sr-only">Buscar establecimiento</label>
              <input type="search" id="establecimientos-search-input" placeholder="Buscar por CIF, nombre...">
            </div>
            <button id="establecimientos-search-btn" class="button button-secondary" type="button" title="Buscar Establecimiento">
              <i data-feather="search"></i>
            </button>
            <button id="create-establecimiento-btn" class="button button-primary">
              <i data-feather="plus"></i><span>Nuevo Establecimiento</span>
            </button>
          </div>
        </div>
        <div id="establecimientos-list-container" class="table-container"></div>
      </div>
    </div>
  </div>
</div>
