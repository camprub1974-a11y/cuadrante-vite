<div id="extra-services-view-content">

    <div class="card">
        <div class="card-header">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24" style="vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Gestión de Servicios Extraordinarios</span>
            </h2>
            <div class="actions-group">
                <button id="generate-pdf-report-btn" class="button button-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    <span>Generar Informe</span>
                </button>
            </div>
        </div>
    </div>

    <div id="extra-services-admin-view" class="hidden">
        <div class="card">
            <div class="card-header">
                <h3>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20" style="vertical-align: middle; margin-right: 8px;">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
                    </svg>
                    <span>Filtros de Búsqueda</span>
                </h3>
            </div>
            <div class="card-body">
                <div class="filter-group">
                    <div class="form-group">
                        <label for="admin-service-filter-agent">Agente</label>
                        <select id="admin-service-filter-agent" class="selector"></select>
                    </div>
                    <div class="form-group">
                        <label for="admin-service-filter-type">Tipo</label>
                        <select id="admin-service-filter-type" class="selector"></select>
                    </div>
                    <div class="form-group">
                        <label for="admin-service-filter-start-date">Desde</label>
                        <input type="date" id="admin-service-filter-start-date">
                    </div>
                    <div class="form-group">
                        <label for="admin-service-filter-end-date">Hasta</label>
                        <input type="date" id="admin-service-filter-end-date">
                    </div>
                    <div class="filter-actions">
                        <button id="admin-service-apply-filters-btn" class="button button-primary">
                            <span>Filtrar</span>
                        </button>
                        <button id="admin-service-clear-filters-btn" class="button button-secondary">
                            <span>Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card no-padding">
            <div class="card-body">
                <div id="admin-services-table-container" class="table-container">
                    </div>
            </div>
        </div>
    </div>

    <div id="extra-services-guard-view" class="hidden">
        <div class="card">
             <div class="card-body">
                <div id="extra-services-calendar-container">
                    <div id="extra-services-calendar"></div>
                </div>
            </div>
        </div>
        <div id="extra-services-stats-container" class="hidden">
        </div>
    </div>
</div>
