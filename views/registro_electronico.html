<div id="registro-view-content">

    <div class="card">

        <div class="card-header">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24" height="24" style="vertical-align: middle; margin-right: 8px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                </svg>
                <span>Registro Electrónico</span>
            </h2>
            <div class="actions-group">
                <button id="create-registro-btn" class="button button-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Nuevo Registro</span>
                </button>
            </div>
        </div>

        <div class="card-body">

            <div class="filter-group">
                <div class="form-group">
                    <label for="registro-filter-year">Año</label>
                    <select id="registro-filter-year" class="selector"></select>
                </div>
                <div class="form-group">
                    <label for="registro-filter-month">Mes</label>
                    <select id="registro-filter-month" class="selector">
                        <option value="all">Todos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="registro-filter-type">Tipo</label>
                    <select id="registro-filter-type" class="selector">
                        <option value="all">Todos</option>
                        <option value="informe">Informe</option>
                        <option value="acta">Acta</option>
                        <option value="atestado">Atestado</option>
                        <option value="oficio">Oficio</option>
                        <option value="estadillo">Estadillo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="registro-filter-destinatario">Agente Destinatario</label>
                    <div class="autocomplete-container">
                        <input type="text" id="registro-filter-destinatario" placeholder="Buscar agente...">
                        <div id="destinatario-suggestions" class="autocomplete-suggestions hidden"></div>
                    </div>
                </div>
                <div class="filter-actions">
                    <button id="apply-registro-filters-btn" class="button button-primary">
                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                        </svg>
                        <span>Filtrar</span>
                    </button>
                    <button id="clear-registro-filters-btn" class="button button-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Limpiar</span>
                    </button>
                </div>
            </div>

            <hr class="subtle-divider">

            <div id="registros-list-container" class="table-container">
                </div>

        </div>
    </div>
</div>
