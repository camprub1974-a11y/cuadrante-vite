<div id="quadrant-view-content">
  <div class="view-header">
    <div class="view-title">
      <i data-feather="calendar"></i>
      <h1>CUADRANTES DE SERVICIO</h1>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="quadrant-controls">
        
        <div class="month-navigation">
          <button id="prevMonthButton" class="icon-button" title="Mes Anterior">
            <i data-feather="chevron-left"></i>
          </button>
          
          <h2 id="currentMonthTitle"></h2>

          <button id="nextMonthButton" class="icon-button" title="Mes Siguiente">
            <i data-feather="chevron-right"></i>
          </button>
        </div>

        <div class="view-actions">
          <div class="filter-group">
            <select id="year-select" class="selector selector-compact"></select>
            <select id="month-select" class="selector selector-compact"></select>
            <select id="agent-select" class="selector selector-compact"></select>
          </div>
          
          <button id="management-selector-btn" class="button button-secondary">
            <i data-feather="settings"></i>
            <span>Gestión</span>
          </button>
        </div>
      </div>

      <div id="seasonal-shift-note" class="info-banner hidden"></div>
    </div>
  </div>

  <div id="schedule-view" class="view-content">
    <div id="schedule-content"></div>
  </div>
</div>

<div class="schedule-info-card">
    <div class="info-card-header">
        <i data-feather="info"></i>
        <h4>Horarios de Turnos</h4>
    </div>
    <div class="info-card-content">
        <ul>
            <li>
                <i data-feather="sunrise"></i>
                <div>
                    <strong>Turno de Mañana:</strong>
                    <span>08:00 a 15:00 horas</span>
                </div>
            </li>
            <li>
                <i data-feather="sunset"></i>
                <div>
                    <strong>Turno de Tarde:</strong>
                    <span>14:00 a 21:00 horas</span>
                </div>
            </li>
        </ul>
    </div>
</div>

<!-- Calendario -->
<div id="calendar-container" style="height: 80vh;"></div>

<!-- ========================================================================== -->
<!-- LEYENDA DE COLORES DE TURNOS - NUEVA -->
<!-- ========================================================================== -->
<div class="calendar-legend">
    <!-- Mañana -->
    <div class="legend-item">
        <span class="legend-color shift-m"></span>
        <span class="legend-text">M = Mañana</span>
    </div>

    <!-- Tarde -->
    <div class="legend-item">
        <span class="legend-color shift-t"></span>
        <span class="legend-text">T = Tarde</span>
    </div>

    <!-- Noche -->
    <div class="legend-item">
        <span class="legend-color shift-n"></span>
        <span class="legend-text">N = Noche</span>
    </div>

    <!-- Libre -->
    <div class="legend-item">
        <span class="legend-color shift-l"></span>
        <span class="legend-text">L = Libre</span>
    </div>

    <!-- Pernoctación -->
    <div class="legend-item">
        <span class="legend-color shift-p"></span>
        <span class="legend-text">P = Permiso</span>
    </div>

    <!-- Vacaciones -->
    <div class="legend-item">
        <span class="legend-color shift-v"></span>
        <span class="legend-text">V = Vacaciones</span>
    </div>

    <!-- Baja -->
    <div class="legend-item">
        <span class="legend-color shift-b"></span>
        <span class="legend-text">B = Baja</span>
    </div>

    <!-- Otros / AP -->
    <div class="legend-item">
        <span class="legend-color shift-ap"></span>
        <span class="legend-text">AP = Asuntos Propios</span>
    </div>

    <!-- Licencia -->
    <div class="legend-item">
        <span class="legend-color shift-lc"></span>
        <span class="legend-text">Lc = Licencia</span>
    </div>
</div>
<!-- FIN LEYENDA ============================================================= -->
